<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{siteName}} — Tin tức</title>
<style>
  :root { --ink:#1d1d1f; --muted:#6b6b70; --line:#e6e3dd; --bg:#faf9f7; --accent:#c8102e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:inherit; text-decoration:none; }
  .masthead { border-bottom:2px solid var(--ink); }
  .masthead .wrap { max-width:1080px; margin:0 auto; padding:22px 20px 14px;
         display:flex; align-items:baseline; justify-content:space-between; }
  .brand { font:700 30px/1 Georgia,"Times New Roman",serif; letter-spacing:-.5px; }
  .brand span { color:var(--accent); }
  .tagline { color:var(--muted); font-size:13px; }
  nav.tabs { max-width:1080px; margin:0 auto; padding:0 20px; display:flex; gap:4px;
         overflow-x:auto; border-bottom:1px solid var(--line); }
  nav.tabs a { padding:12px 16px; font-size:14px; font-weight:600; color:var(--muted);
         white-space:nowrap; border-bottom:3px solid transparent; }
  nav.tabs a.active { color:var(--ink); border-bottom-color:var(--accent); }
  main { max-width:1080px; margin:0 auto; padding:28px 20px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:26px; }
  .card { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff;
         transition:transform .12s ease, box-shadow .12s ease; }
  .card:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.08); }
  .card .cover { aspect-ratio:16/9; background:#efece6 center/cover no-repeat; }
  .card .body { padding:16px 18px 20px; }
  .card .kicker { font-size:11px; font-weight:700; text-transform:uppercase;
         letter-spacing:.08em; color:var(--accent); }
  .card h2 { font:600 20px/1.3 Georgia,serif; margin:8px 0 6px; }
  .card p { color:var(--muted); font-size:14px; margin:0; }
  .empty { color:var(--muted); text-align:center; padding:80px 0; }
  footer { border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
  footer .wrap { max-width:1080px; margin:0 auto; padding:24px 20px; }
</style>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a class="brand" href="/">{{siteName}}<span>.</span></a>
      <span class="tagline">Chạy trên micro-jainslee · sự kiện → SBB → xuất bản</span>
    </div>
  </header>
  <nav class="tabs">{{{tabs}}}</nav>
  <main>
    <div class="grid">{{{articles}}}</div>
    {{{empty}}}
  </main>
  <footer><div class="wrap">© {{year}} {{siteName}} · example-cmr · micro-jainslee event engine</div></footer>
</body>
</html>
