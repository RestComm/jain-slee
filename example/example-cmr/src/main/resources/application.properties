# ── Quarkus HTTP ──
# The CMR site (admin + public) is served by the CMR HTTP resource adaptor on
# a Vert.x server bound to cmr.http.port (8080). Quarkus itself only hosts CDI
# and health, so we move its own port off 8080 to avoid a clash.
quarkus.http.port=8081

# ── CMR site ──
cmr.site-name=MicroNews
cmr.http.port=8082
cmr.upload-dir=cmr-data/media
cmr.categories=news:Tin tức,technology:Công nghệ,business:Kinh doanh,life:Đời sống

# ── CMR admin / auth ──
# Demo credentials — change for anything real. The password is never stored in
# clear; JwtAuthRa keeps SHA-256(username:password) and signs HS256 sessions.
cmr.admin.username=admin
cmr.admin.password=admin
cmr.admin.display-name=Administrator
cmr.auth.secret=cmr-dev-secret-change-me-please-32bytes
cmr.session.cookie=cmr_session
cmr.session.ttl-seconds=3600

# ── micro-jainslee core (adapter-quarkus build-time mapping) ──
microjainslee.container.buffer-size=4096
microjainslee.container.prefer-virtual-threads=true
microjainslee.container.sbb-pool-min=16
microjainslee.container.sbb-pool-max=10000
# Allow empty optional string keys under microjainslee.* (e.g. ai.api-key=)
quarkus.config.mapping.validate-unknown=false

# ── Optional modules — each can be turned off independently ──
microjainslee.telemetry.enabled=true
microjainslee.autonomous.enabled=true

# ── AI agent (jainslee-ai) — requires telemetry ──
# The agent reads the telemetry snapshot, asks an OpenAI-compatible LLM for
# analysis, and (per mode) acts through the guardian/telemetry control surface.
# GUI: the 🤖 tab of the telemetry dashboard (http://localhost:8090/telemetry).
microjainslee.ai.enabled=false
# Put the key in the environment, NOT here: MICROJAINSLEE_AI_API_KEY or DEEPSEEK_API_KEY
microjainslee.ai.api-key=
microjainslee.ai.base-url=https://api.deepseek.com/v1
microjainslee.ai.model=deepseek-chat
# ADVISORY (report only) | SEMI_AUTO (high-confidence only) | FULL_AUTO
microjainslee.ai.mode=FULL_AUTO
microjainslee.ai.interval-seconds=60
microjainslee.ai.timeout-seconds=15
microjainslee.ai.confidence-threshold=0.70
microjainslee.ai.action-cooldown-seconds=300
