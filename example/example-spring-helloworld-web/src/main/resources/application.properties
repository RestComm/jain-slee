# Spring Boot + micro-jainslee HelloWorld demo
spring.application.name=helloworld-spring-demo

# Spring MVC HTTP port — serves static web UI + REST endpoints
server.port=8080

# micro-jainslee core config
microjainslee.event-router.buffer-size=2048
microjainslee.event-router.prefer-virtual-threads=true
microjainslee.sbb-pool.min=16
microjainslee.sbb-pool.max=4096
microjainslee.sbb-pool.per-virtual-thread=true

# HTTP ingress RA (ra-http-server listens on this port)
http.ra.port=8081

# ── Optional modules ──
# Telemetry engine (jainslee-telemetry) — zero-CPU passive collection,
# Prometheus export, alarm engine, auto-reconfig, and dashboard GUI.
microjainslee.telemetry.enabled=true
