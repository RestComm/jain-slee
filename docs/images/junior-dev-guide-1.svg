<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" font-family="system-ui, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="800" height="290" fill="#FAFBFC" rx="8"/>
  <text x="400" y="25" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">One-Way Event Flow (never reverses)</text>

  <!-- Network -->
  <rect x="15" y="45" width="90" height="36" rx="6" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5" filter="url(#sh)"/>
  <text x="60" y="68" text-anchor="middle" font-size="11" fill="#6A1B9A" font-weight="bold">Network</text>

  <!-- RA -->
  <rect x="150" y="45" width="200" height="55" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="250" y="66" text-anchor="middle" font-size="12" fill="#1565C0" font-weight="bold">RA</text>
  <text x="250" y="83" text-anchor="middle" font-size="8" fill="#555">parse + classify</text>
  <text x="250" y="95" text-anchor="middle" font-size="8" fill="#555">fireEvent(...)</text>

  <!-- Core -->
  <rect x="395" y="45" width="200" height="40" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="65" text-anchor="middle" font-size="12" fill="#E65100" font-weight="bold">Core</text>
  <text x="495" y="80" text-anchor="middle" font-size="9" fill="#555">EventRouter (LMAX Disruptor)</text>

  <!-- SBB -->
  <rect x="640" y="45" width="140" height="55" rx="6" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5" filter="url(#sh)"/>
  <text x="710" y="66" text-anchor="middle" font-size="12" fill="#2E7D32" font-weight="bold">SBB</text>
  <text x="710" y="83" text-anchor="middle" font-size="8" fill="#555">onEvent(e, aci)</text>
  <text x="710" y="95" text-anchor="middle" font-size="8" fill="#555">business logic</text>

  <!-- Forward arrows: Network → RA → Core → SBB -->
  <line x1="105" y1="63" x2="145" y2="63" stroke="#E65100" stroke-width="1.8"/>
  <polygon points="143,59 153,63 143,67" fill="#E65100"/>
  <text x="125" y="56" text-anchor="middle" font-size="7" fill="#E65100">bytes</text>

  <line x1="350" y1="63" x2="390" y2="63" stroke="#E65100" stroke-width="1.8"/>
  <polygon points="388,59 398,63 388,67" fill="#E65100"/>

  <line x1="595" y1="63" x2="635" y2="63" stroke="#E65100" stroke-width="1.8"/>
  <polygon points="633,59 643,63 633,67" fill="#E65100"/>

  <!-- Outbound: SBB → RA → Network -->
  <rect x="285" y="120" width="230" height="36" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1" filter="url(#sh)"/>
  <text x="400" y="143" text-anchor="middle" font-size="11" fill="#1565C0" font-weight="bold">OutboundSender</text>

  <!-- SBB to Outbound -->
  <line x1="710" y1="100" x2="710" y2="125" stroke="#555" stroke-width="1.2"/>
  <line x1="710" y1="125" x2="520" y2="125" stroke="#555" stroke-width="1.2"/>
  <line x1="520" y1="125" x2="520" y2="135" stroke="#555" stroke-width="1.2"/>
  <polygon points="514,133 520,147 526,133" fill="#E65100"/>
  <text x="615" y="120" text-anchor="middle" font-size="7" fill="#555">sendCommand(cmd)</text>

  <!-- Outbound to Network -->
  <line x1="285" y1="138" x2="110" y2="138" stroke="#1565C0" stroke-width="1.5"/>
  <polygon points="108,132 98,138 108,144" fill="#1565C0"/>
  <text x="195" y="132" text-anchor="middle" font-size="7" fill="#1565C0">bytes</text>

  <!-- Vertical link from RA to Outbound -->
  <line x1="250" y1="100" x2="250" y2="145" stroke="#555" stroke-width="1.2"/>
  <line x1="250" y1="145" x2="280" y2="138" stroke="#555" stroke-width="1.2"/>

  <!-- Golden rule -->
  <rect x="30" y="180" width="740" height="40" rx="6" fill="#F5F5F5" stroke="#DDD"/>
  <text x="400" y="205" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Golden Rule: SBBs never open sockets. RAs never contain business logic.</text>
</svg>