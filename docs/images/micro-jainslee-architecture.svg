<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/><stop offset="100%" stop-color="#D4521E"/>
    </linearGradient>
    <linearGradient id="appG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/><stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="coreG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/><stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="raG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/><stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <linearGradient id="netG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3E5F5"/><stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-opacity="0.10"/></filter>
    <filter id="shL"><feDropShadow dx="0" dy="0.5" stdDeviation="1" flood-opacity="0.06"/></filter>
    <!-- ARROW DOWN (outbound) -->
    <marker id="down" markerWidth="12" markerHeight="12" refX="6" refY="10" orient="auto">
      <path d="M0,0 L6,10 L12,0" fill="#E65100"/>
    </marker>
    <!-- ARROW UP (inbound) -->
    <marker id="up" markerWidth="12" markerHeight="12" refX="6" refY="2" orient="auto">
      <path d="M0,12 L6,2 L12,12" fill="#1565C0"/>
    </marker>
  </defs>

  <!-- bg -->
  <rect width="960" height="720" fill="#F8F9FA"/>

  <!-- TITLE -->
  <rect x="0" y="0" width="960" height="48" fill="url(#hdr)" rx="6"/>
  <rect x="0" y="30" width="960" height="18" fill="url(#hdr)"/>
  <text x="24" y="31" fill="white" font-size="18" font-weight="700">⚡ micro-jainslee Architecture — JAIN SLEE 1.1 Embeddable Runtime</text>

  <!-- ============ APP LAYER ============ -->
  <rect x="40" y="65" width="880" height="110" rx="8" fill="url(#appG)" stroke="#43A047" stroke-width="1.5" filter="url(#sh)"/>

  <rect x="55" y="72" width="290" height="24" rx="4" fill="#43A047" opacity="0.18"/>
  <text x="70" y="89" font-size="13" font-weight="700" fill="#2E7D32">APPLICATION LAYER — Service Building Blocks</text>
  <text x="70" y="108" font-size="11" fill="#558B2F">Pure business logic · never opens a socket · never parses a protocol</text>

  <!-- SBBs -->
  <rect x="55" y="120" width="150" height="41" rx="6" fill="white" stroke="#66BB6A" stroke-width="1" filter="url(#shL)"/>
  <text x="130" y="145" font-size="13" font-weight="600" fill="#2E7D32" text-anchor="middle">ProxySbb</text>

  <rect x="220" y="120" width="150" height="41" rx="6" fill="white" stroke="#66BB6A" stroke-width="1" filter="url(#shL)"/>
  <text x="295" y="145" font-size="13" font-weight="600" fill="#2E7D32" text-anchor="middle">RegistrationSbb</text>

  <rect x="385" y="120" width="150" height="41" rx="6" fill="white" stroke="#66BB6A" stroke-width="1" filter="url(#shL)"/>
  <text x="460" y="145" font-size="13" font-weight="600" fill="#2E7D32" text-anchor="middle">IceNegotiationSbb</text>

  <rect x="550" y="120" width="150" height="41" rx="6" fill="white" stroke="#A5D6A7" stroke-width="1" filter="url(#shL)"/>
  <text x="625" y="145" font-size="13" fill="#66BB6A" text-anchor="middle">GrpcClientSbb</text>

  <rect x="715" y="120" width="150" height="41" rx="6" fill="white" stroke="#A5D6A7" stroke-width="1" filter="url(#shL)"/>
  <text x="790" y="145" font-size="13" fill="#66BB6A" text-anchor="middle">HttpServerSbb</text>

  <rect x="700" y="72" width="200" height="22" rx="3" fill="#43A047" opacity="0.12"/>
  <text x="800" y="88" font-size="10" font-weight="600" fill="#2E7D32" text-anchor="middle">@InjectRa → sendCommand()</text>

  <!-- === GAP 1: SBB ↔ Core === -->

  <!-- Inbound UP arrow: Core → SBB (event delivery) -->
  <line x1="180" y1="262" x2="180" y2="180" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>
  <line x1="440" y1="262" x2="440" y2="180" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>

  <!-- Inbound label on left side -->
  <rect x="38" y="200" width="248" height="28" rx="5" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="162" y="219" font-size="11" font-weight="700" fill="#1565C0" text-anchor="middle">▲ INBOUND: fireEvent() → VirtualThread</text>

  <!-- Outbound DOWN arrows: SBB → Core (sendCommand) -->
  <line x1="295" y1="161" x2="295" y2="228" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="460" y1="161" x2="460" y2="228" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="625" y1="161" x2="625" y2="228" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="790" y1="161" x2="790" y2="228" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>

  <!-- Outbound label on right side -->
  <rect x="638" y="200" width="262" height="28" rx="5" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1"/>
  <text x="769" y="219" font-size="11" font-weight="700" fill="#E65100" text-anchor="middle">▼ OUTBOUND: sendCommand() · sealed hierarchy</text>

  <!-- ============ CORE LAYER ============ -->
  <rect x="40" y="235" width="880" height="160" rx="8" fill="url(#coreG)" stroke="#FF9800" stroke-width="1.5" filter="url(#sh)"/>

  <rect x="55" y="242" width="280" height="24" rx="4" fill="#FF9800" opacity="0.16"/>
  <text x="70" y="259" font-size="13" font-weight="700" fill="#E65100">CORE RUNTIME — jainslee-core</text>
  <text x="70" y="278" font-size="11" fill="#EF6C00">LMAX Disruptor RingBuffer · VirtualThread per entity · 55,000 events/sec · Lock-free</text>

  <rect x="55" y="290" width="205" height="93" rx="6" fill="white" stroke="#FFB74D" stroke-width="1" filter="url(#shL)"/>
  <text x="157" y="312" font-size="13" font-weight="700" fill="#E65100" text-anchor="middle">EventRouter</text>
  <line x1="75" y1="318" x2="240" y2="318" stroke="#FFE0B2" stroke-width="1"/>
  <text x="157" y="334" font-size="10" fill="#8D6E63" text-anchor="middle">LMAX Disruptor RingBuffer</text>
  <text x="157" y="350" font-size="10" fill="#8D6E63" text-anchor="middle">mapEventToSbb lookup</text>
  <text x="157" y="366" font-size="10" fill="#8D6E63" text-anchor="middle">Buffer 2048 · 6M ev/s</text>

  <rect x="278" y="290" width="195" height="93" rx="6" fill="white" stroke="#FFB74D" stroke-width="1" filter="url(#shL)"/>
  <text x="375" y="312" font-size="13" font-weight="700" fill="#E65100" text-anchor="middle">EntityPool</text>
  <line x1="298" y1="318" x2="453" y2="318" stroke="#FFE0B2" stroke-width="1"/>
  <text x="375" y="334" font-size="10" fill="#8D6E63" text-anchor="middle">VirtualThread per entity</text>
  <text x="375" y="350" font-size="10" fill="#8D6E63" text-anchor="middle">Pool max 100,000</text>
  <text x="375" y="366" font-size="10" fill="#8D6E63" text-anchor="middle">Lock-free · @InjectRa</text>

  <rect x="491" y="290" width="195" height="93" rx="6" fill="white" stroke="#FFB74D" stroke-width="1" filter="url(#shL)"/>
  <text x="588" y="312" font-size="13" font-weight="700" fill="#E65100" text-anchor="middle">IES Dispatcher</text>
  <line x1="511" y1="318" x2="666" y2="318" stroke="#FFE0B2" stroke-width="1"/>
  <text x="588" y="334" font-size="10" fill="#8D6E63" text-anchor="middle">Session convergence</text>
  <text x="588" y="350" font-size="10" fill="#8D6E63" text-anchor="middle">@InitialEventSelect</text>
  <text x="588" y="366" font-size="10" fill="#8D6E63" text-anchor="middle">Convergence key → entity</text>

  <rect x="704" y="290" width="196" height="93" rx="6" fill="white" stroke="#FFB74D" stroke-width="1" filter="url(#shL)"/>
  <text x="802" y="312" font-size="13" font-weight="700" fill="#E65100" text-anchor="middle">Facilities</text>
  <line x1="724" y1="318" x2="880" y2="318" stroke="#FFE0B2" stroke-width="1"/>
  <text x="802" y="334" font-size="10" fill="#8D6E63" text-anchor="middle">HashedWheelTimer</text>
  <text x="802" y="350" font-size="10" fill="#8D6E63" text-anchor="middle">Child SBB cascade</text>
  <text x="802" y="366" font-size="10" fill="#8D6E63" text-anchor="middle">JTA · ActivityContext</text>

  <!-- === GAP 2: Core ↔ RA === -->

  <!-- Inbound UP arrows: RA → Core (parse & fire) -->
  <line x1="160" y1="470" x2="160" y2="416" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>
  <line x1="400" y1="470" x2="400" y2="416" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>
  <line x1="680" y1="470" x2="680" y2="416" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>
  <line x1="860" y1="470" x2="860" y2="416" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>

  <!-- Inbound label on left -->
  <rect x="38" y="425" width="314" height="28" rx="5" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="195" y="444" font-size="11" font-weight="700" fill="#1565C0" text-anchor="middle">▲ INBOUND: Bytes → Parse → classify() → fireEvent()</text>

  <!-- Outbound DOWN arrows: RA → Adapter -->
  <line x1="460" y1="395" x2="460" y2="460" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="625" y1="395" x2="625" y2="460" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>

  <!-- Outbound label on right -->
  <rect x="610" y="425" width="310" height="28" rx="5" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1"/>
  <text x="765" y="444" font-size="11" font-weight="700" fill="#E65100" text-anchor="middle">▼ OUTBOUND: sendCommand() → encode → wire bytes</text>

  <!-- ============ RA LAYER ============ -->
  <rect x="40" y="470" width="880" height="110" rx="8" fill="url(#raG)" stroke="#1E88E5" stroke-width="1.5" filter="url(#sh)"/>

  <rect x="55" y="477" width="480" height="24" rx="4" fill="#1E88E5" opacity="0.12"/>
  <text x="70" y="494" font-size="13" font-weight="700" fill="#1565C0">RESOURCE ADAPTOR LAYER — 3-Port Contract (Endpoint + Command + Bootstrap)</text>
  <text x="70" y="512" font-size="11" fill="#1976D2">Protocol bridge · No business logic</text>

  <rect x="55" y="524" width="168" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="139" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">📡 ra-sip-servlet</text>
  <text x="139" y="557" font-size="9" fill="#78909C" text-anchor="middle">UDP/TCP/TLS · DNS · STUN/ICE</text>

  <rect x="240" y="524" width="168" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="324" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">🔗 ra-diameter</text>
  <text x="324" y="557" font-size="9" fill="#78909C" text-anchor="middle">TCP/SCTP · Cx/Sh/Gx/Ro</text>

  <rect x="425" y="524" width="168" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="509" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">🌐 ra-http-server</text>
  <text x="509" y="557" font-size="9" fill="#78909C" text-anchor="middle">JDK HttpServer · HTTP/2</text>

  <rect x="610" y="524" width="148" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="684" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">⚙️ ra-grpc-client</text>
  <text x="684" y="557" font-size="9" fill="#78909C" text-anchor="middle">io.grpc Stub</text>

  <rect x="775" y="524" width="125" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="837" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">🐪 ra-camel</text>
  <text x="837" y="557" font-size="9" fill="#78909C" text-anchor="middle">Generic bridge</text>

  <!-- === GAP 3: RA → Adapter (outbound only) === -->
  <line x1="139" y1="565" x2="139" y2="612" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="324" y1="565" x2="324" y2="612" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="509" y1="565" x2="509" y2="612" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="684" y1="565" x2="684" y2="612" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>
  <line x1="837" y1="565" x2="837" y2="612" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>

  <rect x="310" y="578" width="340" height="28" rx="5" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1"/>
  <text x="480" y="597" font-size="11" font-weight="700" fill="#E65100" text-anchor="middle">▼ OUTBOUND: encode → Transport.send(bytes, peer)</text>

  <!-- ============ ADAPTER LAYER ============ -->
  <rect x="40" y="619" width="880" height="60" rx="8" fill="url(#netG)" stroke="#8E24AA" stroke-width="1.5" filter="url(#sh)"/>

  <text x="55" y="641" font-size="13" font-weight="700" fill="#6A1B9A">ADAPTER LAYER —</text>

  <rect x="200" y="626" width="130" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="265" y="642" font-size="10" font-weight="700" fill="#6A1B9A" text-anchor="middle">☕ Quarkus ★</text>

  <rect x="340" y="626" width="130" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="405" y="642" font-size="10" fill="#8E24AA" text-anchor="middle">🍃 Spring Boot</text>

  <rect x="480" y="626" width="130" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="545" y="642" font-size="10" fill="#8E24AA" text-anchor="middle">⚡ Embedded J25</text>

  <rect x="620" y="626" width="130" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="685" y="642" font-size="10" fill="#8E24AA" text-anchor="middle">📦 Jakarta EE</text>

  <rect x="760" y="626" width="140" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="830" y="642" font-size="10" fill="#8E24AA" text-anchor="middle">🔥 GraalVM Native</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="688" width="880" height="28" rx="6" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="0.8"/>
  <line x1="65" y1="702" x2="100" y2="702" stroke="#E65100" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="110" y="707" font-size="11" font-weight="600" fill="#546E7A">OUTBOUND: SBB → RA → Network (▼)</text>
  <line x1="350" y1="702" x2="385" y2="702" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>
  <text x="395" y="707" font-size="11" font-weight="600" fill="#546E7A">INBOUND: Network → RA → SBB (▲)</text>
  <text x="700" y="707" font-size="11" font-weight="600" fill="#FF6B35">micro-jainslee 1.2.0 · github.com/nhanth87/jain-slee</text>
</svg>