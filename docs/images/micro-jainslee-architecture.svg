  <line x1="295" y1="395" x2="295" y2="453" stroke="#E65100" stroke-width="2.5"/>
  <line x1="460" y1="395" x2="460" y2="453" stroke="#E65100" stroke-width="2.5"/>
  <line x1="625" y1="395" x2="625" y2="453" stroke="#E65100" stroke-width="2.5"/>
  <line x1="790" y1="395" x2="790" y2="453" stroke="#E65100" stroke-width="2.5"/>
  <polygon points="289,441 301,441 295,453" fill="#E65100"/>
  <polygon points="454,441 466,441 460,453" fill="#E65100"/>
  <polygon points="619,441 631,441 625,453" fill="#E65100"/>
  <polygon points="784,441 796,441 790,453" fill="#E65100"/>
  <rect x="638" y="428" width="244" height="30" rx="5" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1"/>
  <text x="760" y="448" font-size="12" font-weight="700" fill="#E65100" text-anchor="middle">▼ OUTBOUND: sendCommand() → encode</text>
  <!-- RA LAYER -->
  <rect x="40" y="470" width="880" height="110" rx="8" fill="url(#raG)" stroke="#1E88E5" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="55" y="477" width="500" height="24" rx="4" fill="#1E88E5" opacity="0.12"/>
  <text x="70" y="494" font-size="13" font-weight="700" fill="#1565C0">RESOURCE ADAPTOR LAYER — 3-Port Contract (Endpoint + Command + Bootstrap)</text>

  <rect x="55" y="524" width="168" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="139" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">📡 ra-sip-servlet</text>
  <text x="139" y="557" font-size="9" fill="#78909C" text-anchor="middle">UDP/TCP/TLS · DNS · STUN/ICE</text>

  <rect x="240" y="524" width="168" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="324" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">🔗 ra-diameter</text>
  <text x="324" y="557" font-size="9" fill="#78909C" text-anchor="middle">TCP/SCTP · Cx/Sh/Gx/Ro</text>

  <rect x="425" y="524" width="168" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="509" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">🌐 ra-http-server</text>
  <text x="509" y="557" font-size="9" fill="#78909C" text-anchor="middle">JDK HttpServer · HTTP/2</text>

  <rect x="610" y="524" width="148" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="684" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">⚙️ ra-grpc-client</text>
  <text x="684" y="557" font-size="9" fill="#78909C" text-anchor="middle">io.grpc Stub</text>

  <rect x="775" y="524" width="125" height="41" rx="6" fill="white" stroke="#42A5F5" stroke-width="1" filter="url(#shL)"/>
  <text x="837" y="542" font-size="12" font-weight="600" fill="#1565C0" text-anchor="middle">🐪 ra-camel</text>
  <text x="837" y="557" font-size="9" fill="#78909C" text-anchor="middle">Generic bridge</text>
  <!-- GAP 3: OUTBOUND (RA → Adapter) red solid DOWN -->
  <line x1="139" y1="565" x2="139" y2="605" stroke="#E65100" stroke-width="2.5"/>
  <line x1="324" y1="565" x2="324" y2="605" stroke="#E65100" stroke-width="2.5"/>
  <line x1="509" y1="565" x2="509" y2="605" stroke="#E65100" stroke-width="2.5"/>
  <line x1="684" y1="565" x2="684" y2="605" stroke="#E65100" stroke-width="2.5"/>
  <line x1="837" y1="565" x2="837" y2="605" stroke="#E65100" stroke-width="2.5"/>
  <polygon points="133,593 145,593 139,605" fill="#E65100"/>
  <polygon points="318,593 330,593 324,605" fill="#E65100"/>
  <polygon points="503,593 515,593 509,605" fill="#E65100"/>
  <polygon points="678,593 690,593 684,605" fill="#E65100"/>
  <polygon points="831,593 843,593 837,605" fill="#E65100"/>
  <rect x="310" y="573" width="340" height="28" rx="5" fill="#FFF8E1" stroke="#FFB74D" stroke-width="1"/>
  <text x="480" y="592" font-size="12" font-weight="700" fill="#E65100" text-anchor="middle">▼ OUTBOUND: encode → Transport.send(bytes, peer)</text>
  <!-- ADAPTER LAYER -->
  <rect x="40" y="619" width="880" height="60" rx="8" fill="url(#netG)" stroke="#8E24AA" stroke-width="1.5" filter="url(#sh)"/>
  <text x="55" y="641" font-size="13" font-weight="700" fill="#6A1B9A">ADAPTER —</text>
  <rect x="150" y="626" width="125" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="212" y="642" font-size="10" font-weight="700" fill="#6A1B9A" text-anchor="middle">☕ Quarkus ★</text>
  <rect x="285" y="626" width="125" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="347" y="642" font-size="10" fill="#8E24AA" text-anchor="middle">🍃 Spring Boot</text>
  <rect x="420" y="626" width="125" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="482" y="642" font-size="10" fill="#8E24AA" text-anchor="middle">⚡ Embedded J25</text>
  <rect x="555" y="626" width="125" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="617" y="642" font-size="10" fill="#8E24AA" text-anchor="middle">📦 Jakarta EE</text>
  <rect x="690" y="626" width="210" height="22" rx="4" fill="white" stroke="#CE93D8" stroke-width="0.8"/>
  <text x="795" y="642" font-size="10" fill="#8E24AA" text-anchor="middle">🔥 GraalVM Native (in progress)</text>
