  <line x1="680" y1="470" x2="680" y2="424" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="8,5"/>
  <line x1="860" y1="470" x2="860" y2="424" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="8,5"/>
