<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="system-ui, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="800" height="560" fill="#1a1a2e" rx="8"/>
  
  <!-- Title bar -->
  <rect x="10" y="8" width="780" height="42" rx="6" fill="#16213e" stroke="#d4a843" stroke-width="1"/>
  <text x="30" y="34" font-size="15" fill="#d4a843" font-weight="bold">⚙ micro-jainslee TELEMETRY</text>
  <rect x="620" y="16" width="155" height="26" rx="12" fill="#0f3460" stroke="#2ecc71" stroke-width="1"/>
  <text x="698" y="34" text-anchor="middle" font-size="11" fill="#2ecc71">AUTO-RECONFIG: ● ON</text>

  <!-- Row 1: Stat Cards -->
  <rect x="15" y="58" width="185" height="62" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="108" y="78" text-anchor="middle" font-size="9" fill="#c9b37e">ACTIVE SBBs</text>
  <text x="108" y="108" text-anchor="middle" font-size="24" fill="#00ffcc" font-weight="bold">142</text>

  <rect x="210" y="58" width="185" height="62" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="303" y="78" text-anchor="middle" font-size="9" fill="#c9b37e">EVENTS /sec</text>
  <text x="303" y="108" text-anchor="middle" font-size="24" fill="#00ffcc" font-weight="bold">1,234</text>

  <rect x="405" y="58" width="185" height="62" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="498" y="78" text-anchor="middle" font-size="9" fill="#c9b37e">ERRORS (1min)</text>
  <text x="498" y="108" text-anchor="middle" font-size="24" fill="#e74c3c" font-weight="bold">3</text>

  <rect x="600" y="58" width="185" height="62" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="693" y="78" text-anchor="middle" font-size="9" fill="#c9b37e">UPTIME</text>
  <text x="693" y="108" text-anchor="middle" font-size="24" fill="#00ffcc" font-weight="bold">2h 34m</text>

  <!-- Row 2: Gauges -->
  <rect x="15" y="130" width="380" height="95" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="205" y="150" text-anchor="middle" font-size="11" fill="#c9b37e" font-weight="bold">HEAP USAGE</text>
  <!-- Simple arc gauge representation -->
  <path d="M 80 200 A 60 60 0 0 1 200 200" fill="none" stroke="#2ecc71" stroke-width="10" stroke-linecap="round"/>
  <path d="M 200 200 A 60 60 0 0 1 320 200" fill="none" stroke="#2a2a4a" stroke-width="10" stroke-linecap="round"/>
  <text x="200" y="195" text-anchor="middle" font-size="20" fill="#00ffcc" font-weight="bold">25%</text>
  <text x="200" y="215" text-anchor="middle" font-size="9" fill="#c9b37e">128 / 512 MB</text>

  <rect x="405" y="130" width="380" height="95" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="595" y="150" text-anchor="middle" font-size="11" fill="#c9b37e" font-weight="bold">CPU LOAD</text>
  <path d="M 470 200 A 60 60 0 0 1 590 200" fill="none" stroke="#2ecc71" stroke-width="10" stroke-linecap="round"/>
  <path d="M 590 200 A 60 60 0 0 1 710 200" fill="none" stroke="#2a2a4a" stroke-width="10" stroke-linecap="round"/>
  <text x="590" y="195" text-anchor="middle" font-size="20" fill="#00ffcc" font-weight="bold">15%</text>
  <text x="590" y="215" text-anchor="middle" font-size="9" fill="#c9b37e">0.15</text>

  <!-- Row 3: SBB Performance -->
  <rect x="15" y="235" width="770" height="56" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="30" y="255" font-size="10" fill="#c9b37e" font-weight="bold">SBB PERFORMANCE</text>
  <text x="30" y="278" font-size="11" fill="#00ffcc">HelloWorldSbb</text>
  <rect x="150" y="268" width="100" height="6" rx="3" fill="#2ecc71"/>
  <text x="280" y="278" font-size="9" fill="#c9b37e">42 active</text>
  <circle cx="360" cy="274" r="4" fill="#2ecc71"/>
  <text x="370" y="278" font-size="9" fill="#2ecc71">healthy</text>
  <text x="480" y="278" font-size="11" fill="#00ffcc">ProxySbb</text>
  <rect x="570" y="268" width="55" height="6" rx="3" fill="#f39c12"/>
  <text x="640" y="278" font-size="9" fill="#c9b37e">18 active</text>
  <circle cx="700" cy="274" r="4" fill="#2ecc71"/>
  <text x="710" y="278" font-size="9" fill="#2ecc71">healthy</text>

  <!-- Row 4: RA Status -->
  <rect x="15" y="300" width="770" height="48" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="30" y="318" font-size="10" fill="#c9b37e" font-weight="bold">RA STATUS</text>
  <circle cx="30" cy="335" r="4" fill="#2ecc71"/>
  <text x="50" y="339" font-size="10" fill="#00ffcc">http-server-ra  ● ACTIVE  :8080  10,000 ev  5,000 cmd</text>
  <circle cx="30" cy="355" r="4" fill="#2ecc71"/><text x="50" y="359" font-size="10" fill="#00ffcc">sip-servlet-ra  ● ACTIVE  :5060   5,000 ev  2,500 cmd</text>

  <!-- Row 5: Alarms -->
  <rect x="15" y="358" width="770" height="56" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="30" y="378" font-size="10" fill="#c9b37e" font-weight="bold">ALARMS</text>
  <rect x="110" y="368" width="20" height="14" rx="3" fill="#e74c3c"/>
  <text x="120" y="379" font-size="9" fill="#fff">2</text>
  <text x="140" y="378" font-size="9" fill="#c9b37e">active</text>
  <text x="205" y="378" font-size="9" fill="#d4a843">[history]</text>
  <text x="30" y="400" font-size="9" fill="#f39c12">⚠ WARNING  12:34  heap>85%, pool halved</text>
  <text x="620" y="400" font-size="9" fill="#d4a843">[ACK]</text>
  <text x="30" y="410" font-size="9" fill="#e74c3c">🔴 CRITICAL 12:30  Error storm: ProxySbb suspended</text>
  <text x="620" y="410" font-size="9" fill="#d4a843">[ACK]</text>

  <!-- Row 6: Config -->
  <rect x="15" y="424" width="770" height="36" rx="6" fill="#16213e" stroke="#3a3a5a" stroke-width="1" filter="url(#sh)"/>
  <text x="30" y="447" font-size="10" fill="#c9b37e" font-weight="bold">CONFIG  </text>
  <text x="80" y="447" font-size="9" fill="#c9b37e">Auto-reconfig: [● ON]  Memory warn: [85%]  CPU warn: [80%]  Error storm: [100/min]  Stale warn: [5min]</text>
  
  <!-- Footer -->
  <text x="400" y="500" text-anchor="middle" font-size="9" fill="#3a3a5a">Steampunk Dashboard — jainslee-monitor — 2s polling</text>
</svg>