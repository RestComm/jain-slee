<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <defs><style>
    text { font-family: Menlo, Monaco, 'Courier New', monospace; }
    .title { font-size: 13px; font-weight: bold; }
    .body { font-size: 11px; }
    .small { font-size: 10px; }
    .tiny { font-size: 9px; }
  </style></defs>

  <!-- Outer shell: micro-jainslee -->
  <rect x="12" y="8" width="936" height="682" rx="8" fill="#FAFAFA" stroke="#607D8B" stroke-width="2"/>
  <text x="28" y="34" class="title" fill="#37474F">micro-jainslee</text>

  <!-- ======= LEFT COLUMN ======= -->

  <!-- jainslee-api box (Green) -->
  <rect x="28" y="48" width="220" height="120" rx="5" fill="#E8F5E9" stroke="#43A047" stroke-width="1.8"/>
  <text x="42" y="70" class="title" fill="#2E7D32">jainslee-api</text>
  <line x1="36" y1="78" x2="240" y2="78" stroke="#A5D6A7" stroke-width="1"/>
  <text x="42" y="98" class="body" fill="#33691E">TelemetryPort</text>
  <text x="42" y="117" class="small" fill="#558B2F">(interface)</text>

  <!-- jainslee-core box (Orange) -->
  <rect x="28" y="190" width="220" height="118" rx="5" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.8"/>
  <text x="42" y="212" class="title" fill="#E65100">jainslee-core</text>
  <line x1="36" y1="220" x2="240" y2="220" stroke="#FFE0B2" stroke-width="1"/>
  <text x="42" y="240" class="body" fill="#BF360C">Container</text>
  <text x="42" y="260" class="body" fill="#BF360C">EventRouter</text>
  <text x="42" y="280" class="body" fill="#BF360C">SbbPool</text>

  <!-- ======= RIGHT COLUMN ======= -->

  <!-- jainslee-telemetry box (Purple) -->
  <rect x="270" y="48" width="510" height="264" rx="5" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.8"/>
  <text x="286" y="70" class="title" fill="#6A1B9A">jainslee-telemetry</text>
  <line x1="280" y1="78" x2="770" y2="78" stroke="#CE93D8" stroke-width="1"/>

  <text x="290" y="98" class="body" fill="#4A148C">MicrometerTelemetryPort</text>
  <line x1="298" y1="104" x2="770" y2="104" stroke="#E1BEE7" stroke-width="0.5"/>

  <text x="298" y="122" class="body" fill="#6A1B9A">├─ SbbCollector         (AtomicLong)</text>
  <text x="298" y="141" class="body" fill="#6A1B9A">├─ RaCollector          (AtomicLong)</text>
  <text x="298" y="160" class="body" fill="#6A1B9A">├─ ErrorCollector       (RingBuffer 1000)</text>
  <text x="298" y="179" class="body" fill="#6A1B9A">├─ ResourceMonitor      (Daemon VT, 30s)</text>
  <text x="298" y="198" class="body" fill="#6A1B9A">├─ SpunkDetector        (onEvent callback)</text>
  <text x="298" y="217" class="body" fill="#6A1B9A">├─ StaleDetector        (heartbeat + scan)</text>
  <text x="298" y="236" class="body" fill="#6A1B9A">├─ AlarmEngine          (RingBuffer 500)</text>
  <text x="298" y="255" class="body" fill="#6A1B9A">├─ AutoReconfigEngine   (30s evaluate) ⚡</text>
  <text x="298" y="274" class="body" fill="#6A1B9A">└─ PrometheusExporter   (OpenMetrics)</text>

  <!-- ======= BOTTOM SECTION ======= -->

  <!-- jainslee-telemetry-vertx box (Gray) -->
  <rect x="270" y="340" width="510" height="62" rx="5" fill="#ECEFF1" stroke="#78909C" stroke-width="1.8"/>
  <text x="286" y="361" class="title" fill="#37474F">jainslee-telemetry-vertx (GUI — separate module)</text>
  <line x1="280" y1="367" x2="770" y2="367" stroke="#B0BEC5" stroke-width="1"/>
  <text x="298" y="383" class="body" fill="#455A64">GET /telemetry/     → index.html (steampunk dashboard)</text>
  <text x="298" y="397" class="body" fill="#455A64">GET /api/telemetry/ → JSON endpoints</text>

  <!-- ======= ARROWS ======= -->

  <!-- Arrow 1: TelemetryPort ◄─ MicrometerTelemetryPort (blue left arrow) -->
  <line x1="270" y1="92" x2="252" y2="92" stroke="#1E88E5" stroke-width="2"/>
  <polygon points="252,92 260,86 260,98" fill="#1E88E5"/>

  <!-- Arrow 2: Container ◄─ MicrometerTelemetryPort (blue left arrow) -->
  <line x1="270" y1="240" x2="252" y2="240" stroke="#1E88E5" stroke-width="2"/>
  <polygon points="252,240 260,234 260,246" fill="#1E88E5"/>

  <!-- Arrow 3: EventRouter → SbbCollector.record() + ErrorCollector.record() -->
  <!-- Path: from EventRouter in core, down then right then up into telemetry -->
  <path d="M 80,260 L 80,325 L 340,325 L 340,112"
        fill="none" stroke="#E65100" stroke-width="1.8" stroke-dasharray="6,3"/>
  <polygon points="340,118 334,128 346,128" fill="#E65100"/>

  <!-- Label on arrow -->
  <text x="345" y="220" class="tiny" fill="#D84315">onEventProcessed() → SbbCollector.record()</text>
  <text x="345" y="232" class="tiny" fill="#D84315">onError()          → ErrorCollector.record()</text>

</svg>