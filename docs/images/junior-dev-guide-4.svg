<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 110" font-family="system-ui, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="800" height="110" fill="#FAFBFC" rx="8"/>
  <text x="400" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">RA Lifecycle (3-Port)</text>

  <rect x="10" y="38" width="175" height="30" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.2" filter="url(#sh)"/>
  <text x="98" y="58" text-anchor="middle" font-size="9" fill="#1565C0" font-weight="bold">container.registerRa(...)</text>

  <line x1="185" y1="53" x2="208" y2="53" stroke="#E65100" stroke-width="1.5"/>
  <polygon points="206,49 216,53 206,57" fill="#E65100"/>

  <rect x="218" y="38" width="175" height="30" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.2" filter="url(#sh)"/>
  <text x="306" y="58" text-anchor="middle" font-size="9" fill="#E65100" font-weight="bold">container STARTED</text>

  <line x1="393" y1="53" x2="416" y2="53" stroke="#E65100" stroke-width="1.5"/>
  <polygon points="414,49 424,53 414,57" fill="#E65100"/>

  <rect x="426" y="38" width="175" height="30" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2" filter="url(#sh)"/>
  <text x="514" y="58" text-anchor="middle" font-size="9" fill="#2E7D32" font-weight="bold">endpoint.activate()</text>

  <line x1="601" y1="53" x2="624" y2="53" stroke="#E65100" stroke-width="1.5"/>
  <polygon points="622,49 632,53 622,57" fill="#E65100"/>

  <rect x="634" y="38" width="155" height="30" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1.2" filter="url(#sh)"/>
  <text x="712" y="58" text-anchor="middle" font-size="9" fill="#2E7D32" font-weight="bold">RA opens transport</text>

  <text x="400" y="92" text-anchor="middle" font-size="9" fill="#555">... running (events flowing, commands flowing) ... → container.stop() → endpoint.deactivate() → RA closes transport</text>
</svg>